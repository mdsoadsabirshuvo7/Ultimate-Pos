<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline - Sector71</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#1f2937}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:100%;max-width:560px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
    h1{margin:0 0 8px;font-size:24px}
    p{margin:8px 0;line-height:1.5}
    .muted{color:#6b7280;font-size:14px}
    .btn{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:8px;background:#1d4ed8;color:#fff;text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>You are offline</h1>
      <p>The app is running in offline mode. Previously visited pages and queued actions will sync automatically when internet is back.</p>
      <p class="muted">If a page is not cached yet, reconnect once to open it and make it available offline next time.</p>
      <a class="btn" href="/home">Try Home</a>
    </div>
  </div>
</body>
</html>
